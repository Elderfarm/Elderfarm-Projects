{% extends "base.html" %}
{% block title %}Glemt adgangskode — PostMester{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔑</div>
    <h1 class="auth-title">Glemt adgangskode?</h1>
    <p class="auth-sub">Skriv din email — vi sender dig et link til at nulstille den.</p>

    <form method="POST" class="auth-form">
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="auth-input" placeholder="din@email.dk" required autofocus>
      </div>
      <button type="submit" class="auth-btn">Send nulstillingslink →</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('login') }}">← Tilbage til log ind</a></p>
  </div>
</div>
{% endblock %}
