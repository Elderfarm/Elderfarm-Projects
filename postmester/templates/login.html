{% extends "base.html" %}
{% block title %}Log ind — PostMester{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔨</div>
    <h1 class="auth-title">Velkommen tilbage</h1>
    <p class="auth-sub">Log ind på din PostMester-konto</p>

    <form method="POST" class="auth-form">
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="auth-input" placeholder="din@email.dk" required autofocus>
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-btn">Log ind →</button>
    </form>

    <p class="auth-switch">Har du ikke en konto? <a href="{{ url_for('register') }}">Opret gratis konto</a></p>
  </div>
</div>
{% endblock %}
