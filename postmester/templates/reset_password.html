{% extends "base.html" %}
{% block title %}Nulstil adgangskode — PostMester{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 class="auth-title">Ny adgangskode</h1>
    <p class="auth-sub">Vælg en ny adgangskode til din konto.</p>

    <form method="POST" class="auth-form">
      <div class="field-group">
        <label class="field-label" for="password">Ny adgangskode</label>
        <input type="password" id="password" name="password" class="auth-input" placeholder="Mindst 6 tegn" required autofocus>
      </div>
      <button type="submit" class="auth-btn">Gem ny adgangskode →</button>
    </form>
  </div>
</div>
{% endblock %}
