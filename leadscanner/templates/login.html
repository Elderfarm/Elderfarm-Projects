{% extends "base.html" %}
{% block title %}Log ind — Leadscanner{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Log ind</h1>
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Adgangskode</label>
      <input type="password" name="password" required>
      <button type="submit" class="cta-btn full-width">Log ind</button>
    </form>
    <p class="auth-alt">Ny hos Leadscanner? <a href="{{ url_for('register') }}">Opret gratis konto</a></p>
  </div>
</div>
{% endblock %}
